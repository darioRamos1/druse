name: Informe de fallo
description: Algo no funciona como debería
labels: ['fallo']
body:
  - type: markdown
    attributes:
      value: |
        Antes de empezar: **no pegues contraseñas, cadenas de conexión completas,
        claves de API ni datos de tus clientes.** Si un mensaje de error los
        incluye, sustitúyelos antes de copiarlo.

        Si es un fallo de seguridad, no lo publiques aquí: sigue
        [SECURITY.md](https://github.com/darioRamos1/druse/blob/main/SECURITY.md).

  - type: input
    id: version
    attributes:
      label: Versión de Druse
      description: Aparece en Preferencias, junto con la variante (completa o sin Informix).
      placeholder: '1.2.1 completa'
    validations:
      required: true

  - type: input
    id: sistema
    attributes:
      label: Sistema operativo
      placeholder: 'Windows 11 24H2'
    validations:
      required: true

  - type: input
    id: motor
    attributes:
      label: Motor y versión
      description: Si el fallo no depende de una base de datos, escribe «no aplica».
      placeholder: 'PostgreSQL 16.4'
    validations:
      required: true

  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      description: Qué hiciste, en orden. Un caso que se puede repetir vale más que una descripción larga.
      placeholder: |
        1. Abrir la conexión ...
        2. Ejecutar ...
        3. Pulsar ...
    validations:
      required: true

  - type: textarea
    id: esperado
    attributes:
      label: Qué esperabas y qué pasó
    validations:
      required: true

  - type: textarea
    id: mensaje
    attributes:
      label: Mensaje de error, si lo hubo
      description: Se formatea como código automáticamente.
      render: text

  - type: checkboxes
    id: comprobaciones
    attributes:
      label: Antes de enviar
      options:
        - label: He revisado que no van contraseñas, claves ni datos de clientes en lo que escribí.
          required: true
        - label: Uso la última versión publicada, o digo arriba por qué no.
          required: true
