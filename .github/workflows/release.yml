name: Publicar versión

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Instaladores y actualización
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar la clave del actualizador
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Falta el secreto TAURI_SIGNING_PRIVATE_KEY.'
          }

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar CLI de Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Construir y publicar
        shell: pwsh
        run: ./build/scripts/release.ps1 -Publish
