name: Publicar versión

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # Publicar es lo único que sale de aquí hacia los equipos de otras personas, y
  # `workflow_dispatch` acepta cualquier rama o etiqueta: nada impedía lanzar una
  # versión desde un commit que la integración continua nunca vio, o que vio en
  # rojo. Este job pregunta por el commit concreto que se va a empaquetar.
  checks:
    name: El commit está validado
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Exigir una ejecución de CI en verde para este commit
        run: |
          sha='${{ github.sha }}'
          echo "Commit a publicar: $sha"

          consulta="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&status=completed&per_page=100"

          ejecuciones=$(gh api "$consulta" --jq '.workflow_runs | length')

          if [ "$ejecuciones" -eq 0 ]; then
            echo "::error::La integración continua no ha terminado nunca sobre $sha. Lanza CI sobre este commit y espera a que acabe."
            exit 1
          fi

          # Se mira la más reciente y no «alguna en verde»: si el commit se
          # reintentó y la última quedó en rojo, publicarlo sería publicar algo
          # que se sabe roto.
          conclusion=$(gh api "$consulta" --jq '.workflow_runs | sort_by(.run_started_at) | last | .conclusion')

          echo "Última ejecución de CI sobre este commit: $conclusion"

          if [ "$conclusion" != "success" ]; then
            echo "::error::La última ejecución de CI sobre $sha terminó en '$conclusion'. No se publica."
            exit 1
          fi

  windows:
    name: Instaladores y actualización
    runs-on: windows-latest
    needs: checks
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Comprobar la clave del actualizador
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Falta el secreto TAURI_SIGNING_PRIVATE_KEY.'
          }

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar CLI de Tauri
        run: cargo install tauri-cli --version "^2" --locked

      - name: Construir y publicar
        shell: pwsh
        run: ./build/scripts/release.ps1 -Publish
