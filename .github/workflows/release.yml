name: Publicar versión

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  # Publicar es lo único que sale de aquí hacia los equipos de otras personas, y
  # `workflow_dispatch` acepta cualquier rama o etiqueta: nada impedía lanzar una
  # versión desde un commit que la integración continua nunca vio, o que vio en
  # rojo. Este job pregunta por el commit concreto que se va a empaquetar.
  checks:
    name: El commit está validado
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Exigir CI general y Comunidad para el commit exacto
        shell: pwsh
        run: |
          . ./build/scripts/verificacion-release.ps1
          foreach ($workflow in @('ci.yml', 'comunidad.yml')) {
            $result = Get-DruseEstadoCI -Repository $env:GITHUB_REPOSITORY -Commit $env:GITHUB_SHA -Workflow $workflow
            if (-not $result.verde) { throw $result.detalle }
            Write-Host $result.detalle
          }

  windows:
    name: Instaladores y actualización
    runs-on: windows-latest
    needs: checks
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Comprobar la clave del actualizador
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Falta el secreto TAURI_SIGNING_PRIVATE_KEY.'
          }

      - name: Instalar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # rama stable, 3-9-2026
        with:
          toolchain: stable

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar CLI de Tauri
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Construir y publicar
        shell: pwsh
        run: ./build/scripts/release.ps1 -Publish
