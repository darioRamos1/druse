name: Publicar versión

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI, Verificar edición Comunidad]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Publicar es lo único que sale de aquí hacia los equipos de otras personas, y
  # `workflow_dispatch` acepta cualquier rama o etiqueta: nada impedía lanzar una
  # versión desde un commit que la integración continua nunca vio, o que vio en
  # rojo. Este job pregunta por el commit concreto que se va a empaquetar.
  checks:
    name: El commit está validado
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-latest
    outputs:
      publicar: ${{ steps.checks.outputs.publicar }}
      commit: ${{ steps.checks.outputs.commit }}
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Exigir CI general y Comunidad para el commit exacto
        id: checks
        shell: pwsh
        env:
          DRUSE_AUTOMATICA: ${{ github.event_name == 'workflow_run' }}
        run: |
          . ./build/scripts/publicacion-automatica.ps1
          $commit = (git rev-parse HEAD).Trim()
          $version = (Get-Content shells/desktop-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $result = Get-DruseDecisionPublicacion -Repository $env:GITHUB_REPOSITORY -Commit $commit -Version $version -Automatica:($env:DRUSE_AUTOMATICA -eq 'true')
          Write-Host $result.detalle
          "publicar=$($result.publicar.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "commit=$commit" >> $env:GITHUB_OUTPUT

  windows:
    name: Instaladores, portables y actualización
    runs-on: windows-latest
    needs: checks
    if: needs.checks.outputs.publicar == 'true'
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.checks.outputs.commit }}
          persist-credentials: false

      - name: Comprobar la clave del actualizador
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw 'Falta el secreto TAURI_SIGNING_PRIVATE_KEY.'
          }

      - name: Instalar .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # rama stable, 3-9-2026
        with:
          toolchain: stable

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar CLI de Tauri
        run: cargo install tauri-cli --version 2.11.4 --locked

      - name: Construir y publicar
        shell: pwsh
        run: ./build/scripts/release.ps1 -Publish
