name: Publicar landing en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "frontend/src/app/shared/privacy/privacy-notice.html"
      - "build/scripts/generar-privacidad-web.cjs"
      - "build/scripts/generar-descargas-web.cjs"
      - ".github/workflows/pages.yml"
  release:
    types: [published]
  # Las releases creadas con GITHUB_TOKEN no disparan el evento release.
  # workflow_run permite refrescar las descargas también en ese caso.
  workflow_run:
    workflows: [Publicar versión]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  solicitar-publicacion:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # El entorno de Pages solo admite main. Un evento release usa la etiqueta
      # como referencia aunque el checkout pida main; el despliegue se rechaza.
      - name: Solicitar el despliegue desde main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run pages.yml --ref main

  deploy:
    if: >-
      github.event_name != 'release' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Preparar las descargas de la última versión publicada
        env:
          GH_TOKEN: ${{ github.token }}
        run: node build/scripts/generar-descargas-web.cjs
      - name: Comprobar el aviso compartido de privacidad
        run: node build/scripts/generar-privacidad-web.cjs --check
      - name: Configurar Pages
        uses: actions/configure-pages@v6
      - name: Subir únicamente la landing
        uses: actions/upload-pages-artifact@v5
        with:
          path: landing
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
