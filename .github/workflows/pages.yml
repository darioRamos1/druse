name: Publicar landing en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "landing/**"
      - "frontend/src/app/shared/privacy/privacy-notice.html"
      - "build/scripts/generar-privacidad-web.cjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener el repositorio
        uses: actions/checkout@v7.0.1
      - name: Comprobar el aviso compartido de privacidad
        run: node build/scripts/generar-privacidad-web.cjs --check
      - name: Configurar Pages
        uses: actions/configure-pages@v6
      - name: Subir únicamente la landing
        uses: actions/upload-pages-artifact@v5
        with:
          path: landing
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v5
