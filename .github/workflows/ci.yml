name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore backend/Druse.slnx

      - name: Compilar
        run: dotnet build backend/Druse.slnx --configuration Release --no-restore

      - name: Probar
        run: dotnet test backend/Druse.slnx --configuration Release --no-build --verbosity normal

  # Las pruebas contra motores reales solo corren en Linux: los ejecutores de
  # Windows y macOS no traen Docker, y montarlo ahí multiplicaría el tiempo sin
  # aportar nada. Lo que se valida aquí son los proveedores, no el sistema.
  backend-con-motores-reales:
    name: Backend con PostgreSQL, SQL Server y MySQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: druse_dev_only
          POSTGRES_DB: druse_test
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Druse_dev_only_1
          MSSQL_PID: Developer
        ports:
          - 14433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Druse_dev_only_1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: druse_dev_only
          MYSQL_DATABASE: druse_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pdruse_dev_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DRUSE_TEST_PG_HOST: 127.0.0.1
      DRUSE_TEST_PG_PORT: 55440
      DRUSE_TEST_PG_DB: druse_test
      DRUSE_TEST_PG_USER: postgres
      DRUSE_TEST_PG_PASSWORD: druse_dev_only

      DRUSE_TEST_MSSQL_HOST: 127.0.0.1
      DRUSE_TEST_MSSQL_PORT: 14433
      DRUSE_TEST_MSSQL_DB: druse_test
      DRUSE_TEST_MSSQL_USER: sa
      DRUSE_TEST_MSSQL_PASSWORD: Druse_dev_only_1

      DRUSE_TEST_MYSQL_HOST: 127.0.0.1
      DRUSE_TEST_MYSQL_PORT: 33306
      DRUSE_TEST_MYSQL_DB: druse_test
      DRUSE_TEST_MYSQL_USER: root
      DRUSE_TEST_MYSQL_PASSWORD: druse_dev_only

      # Sin esto, un motor caído se manifestaría como una suite en verde que no
      # comprobó nada. Aquí ese caso debe romper la compilación.
      DRUSE_REQUIRE_ENGINES: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Crear la base de SQL Server
        run: |
          docker exec "${{ job.services.sqlserver.id }}" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Druse_dev_only_1' -C \
            -Q "IF DB_ID('druse_test') IS NULL CREATE DATABASE druse_test;"

      - name: Probar contra los tres motores
        run: dotnet test backend/Druse.slnx --configuration Release --verbosity normal

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Probar
        run: npm test

  # Compila el envoltorio de escritorio. No genera instaladores —eso se hace al
  # publicar una versión— pero sí detecta que el código Rust dejó de compilar,
  # que es lo que se escaparía sin este job.
  escritorio:
    name: Envoltorio de escritorio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de Tauri en Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Comprobar que el envoltorio compila
        working-directory: shells/desktop-tauri
        run: cargo check --locked

  # Comprueba que la API se puede publicar autocontenida para cada plataforma
  # objetivo, sin que el usuario final necesite el SDK de .NET (ADR 0003).
  publicacion-autocontenida:
    name: Publicación autocontenida (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar
        run: >
          dotnet publish backend/src/Druse.Host.LocalApi
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.rid }}
