# Todo lo de fuera va fijado por SHA o por digest, y no por etiqueta.
#
# `@v4` y `:2022-latest` son punteros que alguien más puede mover: quien
# controle una de esas acciones puede cambiar lo que ejecutan mis runners —con
# mis secretos delante— sin que aquí cambie una línea. Un SHA no se mueve.
#
# El precio es que ya no se actualizan solas, y por eso está Dependabot
# (`.github/dependabot.yml`): propone el salto en un PR, con su diario de
# cambios, y la actualización pasa a ser una decisión con nombre y fecha en vez
# de algo que ocurrió sin que nadie lo mirara. La versión legible va en el
# comentario de al lado para no tener que resolver el SHA al leer.

# Y no todo corre en los tres sistemas en cada push, por dinero.
#
# En un repositorio privado los minutos de Actions se consumen de la cuota, y no
# valen lo mismo: un minuto de Windows cuenta por dos y uno de macOS por diez.
# Con quince trabajos por push, nueve de ellos en esos dos sistemas, la cuota se
# acaba —y cuando se acaba, GitHub no ejecuta nada: los trabajos mueren en tres
# segundos con «The job was not started because recent account payments have
# failed or your spending limit needs to be increased», que es exactamente lo que
# lleva pasando desde el 11 de septiembre de 2026.
#
# Así que en cada push corre lo que solo puede fallar en su sistema —Windows es
# donde se reparte Druse— y lo que no depende del sistema corre una sola vez, en
# Linux. Lo demás va al recorrido completo, que **no se dispara solo**: se pide a
# mano con la entrada `completo`, y por eso no hay aquí ninguna tarea programada.
# Nada de esto gasta cuota sin que alguien lo pida, y lo que se deja fuera de un
# push no queda probado hasta que se pida ese recorrido. Si el repositorio se
# abriera, los runners estándar dejarían de costar y esto podría revisarse.

name: CI

# **No se dispara con los push.** Ver el comentario de arriba: mientras la cuenta
# no tenga cuota de Actions, cada push producía dieciséis trabajos rojos que no
# llegaban a empezar, y un rojo que no significa nada acaba enseñando a ignorar
# los rojos. Lo que comprueba esto lo ejecuta `build/scripts/comprobar-todo.ps1`
# en la máquina de quien programa; aquí se pide a mano cuando haya con qué.
on:
  workflow_dispatch:
    inputs:
      completo:
        description: 'Recorrer también Windows y macOS donde no se hace en cada push'
        type: boolean
        default: false

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows en cada push porque es donde se reparte Druse y donde vive el
        # código que solo existe ahí —el almacén de credenciales, las rutas del
        # perfil—. macOS, en el recorrido completo: cuesta diez veces más y
        # ninguna release sale de ahí todavía.
        os: >-
          ${{ fromJSON((github.event.inputs.completo == 'true')
          && '["windows-latest","ubuntu-latest","macos-latest"]'
          || '["windows-latest","ubuntu-latest"]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # El clidriver de IBM —el que usa Informix— depende de libxml2, que es del
      # sistema y no viaja en el paquete. Sin ella la carga falla y la excepción
      # se lleva por delante el proceso de pruebas entero, no solo las suyas.
      - name: Dependencia nativa de Informix
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libxml2

      # `-m:1` en los tres pasos: IKVM traduce el jar de Informix y dos proyectos
      # haciéndolo a la vez chocan sobre su propio log con «os error 32». El
      # mensaje no menciona el paralelismo, así que cuesta reconocerlo.
      - name: Restaurar
        run: dotnet restore backend/Druse.slnx -m:1

      - name: Compilar
        run: dotnet build backend/Druse.slnx --configuration Release --no-restore -m:1

      - name: Probar
        run: >
          dotnet test backend/Druse.slnx
          --configuration Release
          --no-build
          -m:1
          --verbosity normal
          --results-directory artifacts/test-results
          --logger trx

      # Un verde sin pruebas ejecutadas no se distingue de un verde de verdad.
      # Este paso lee los TRX y rompe el job si falta una suite o si alguna no
      # ejecutó nada.
      - name: Comprobar que se ejecutaron pruebas
        if: always()
        shell: pwsh
        run: >
          ./build/scripts/check-tests.ps1
          -ResultsDirectory artifacts/test-results
          -ExpectedSuites 3
          -MinimumTests 500

  # Las pruebas contra motores reales solo corren en Linux: los ejecutores de
  # Windows y macOS no traen Docker, y montarlo ahí multiplicaría el tiempo sin
  # aportar nada. Lo que se valida aquí son los proveedores, no el sistema.
  backend-con-motores-reales:
    name: Backend con los cuatro motores
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
        env:
          POSTGRES_PASSWORD: druse_dev_only
          POSTGRES_DB: druse_test
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest@sha256:ba4c8329f48fb8f02e1416be6a930ebfd71268caee78aa985f3af4315e457c89
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Druse_dev_only_1
          MSSQL_PID: Developer
        ports:
          - 14433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Druse_dev_only_1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

      mysql:
        image: mysql:8.4@sha256:1d6b6a8fcee8ff758ff151d017f5203cd06792a0e698f0a593c9dfcb14609cf0
        env:
          MYSQL_ROOT_PASSWORD: druse_dev_only
          MYSQL_DATABASE: druse_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pdruse_dev_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DRUSE_TEST_PG_HOST: 127.0.0.1
      DRUSE_TEST_PG_PORT: 55440
      DRUSE_TEST_PG_DB: druse_test
      DRUSE_TEST_PG_SECOND_DB: druse_test_secondary
      DRUSE_TEST_PG_USER: postgres
      DRUSE_TEST_PG_PASSWORD: druse_dev_only

      DRUSE_TEST_MSSQL_HOST: 127.0.0.1
      DRUSE_TEST_MSSQL_PORT: 14433
      DRUSE_TEST_MSSQL_DB: druse_test
      DRUSE_TEST_MSSQL_SECOND_DB: druse_test_secondary
      DRUSE_TEST_MSSQL_USER: sa
      DRUSE_TEST_MSSQL_PASSWORD: Druse_dev_only_1

      DRUSE_TEST_MYSQL_HOST: 127.0.0.1
      DRUSE_TEST_MYSQL_PORT: 33306
      DRUSE_TEST_MYSQL_DB: druse_test
      DRUSE_TEST_MYSQL_SECOND_DB: druse_test_secondary
      DRUSE_TEST_MYSQL_USER: root
      DRUSE_TEST_MYSQL_PASSWORD: druse_dev_only

      DRUSE_TEST_IFX_HOST: 127.0.0.1
      DRUSE_TEST_IFX_PORT: 9089
      DRUSE_TEST_IFX_DB: druse_test
      DRUSE_TEST_IFX_SECOND_DB: druse_test2
      DRUSE_TEST_IFX_USER: informix
      DRUSE_TEST_IFX_PASSWORD: in4mix
      DRUSE_TEST_IFX_SQLI_PORT: 9088

      # Sin esto, un motor caído se manifestaría como una suite en verde que no
      # comprobó nada. Aquí ese caso debe romper la compilación.
      DRUSE_REQUIRE_ENGINES: '1'

      # Menos Oracle, que este job no levanta: su imagen ronda los 2 GB y tarda
      # un par de minutos en arrancar. Exigirlo aquí ponía en rojo el job entero
      # por un motor que nunca se pensó levantar, y el nombre de este job —«los
      # cuatro motores»— ya decía cuáles son. Oracle se prueba en local con
      # build/scripts/test-db.ps1 -Engine oracle; queda anotado en
      # docs/motores/matriz-de-motores.md para que la ausencia no pase por cobertura.
      DRUSE_OPTIONAL_ENGINES: oracle

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      # El clidriver de IBM depende de libxml2, que es del sistema y no viaja en
      # el paquete: sin ella la carga falla y la excepción se lleva por delante
      # el proceso de pruebas entero, no solo las de Informix.
      - name: Dependencia nativa de Informix
        run: sudo apt-get update && sudo apt-get install -y libxml2

      # Informix va como paso y no como `service` a propósito. Su comprobación de
      # salud necesita un shell de login —`onstat` no está en el PATH sin cargar
      # el perfil— y el arranque pasa de largo cualquier margen razonable de los
      # servicios, así que como servicio el job muere con «One or more containers
      # failed to start» sin más explicación. Aquí se espera con el mismo bucle
      # que usa `build/scripts/test-db.ps1`, que es el que ya funciona en local.
      #
      # Se publican los dos escuchadores. El 9089 es DRDA, por donde habla el
      # proveedor nativo; el 9088 atiende SQLI, que es por donde entra el puente
      # JDBC. Confundirlos da un error que parece de credenciales, pero las
      # pruebas del transporte SQLI necesitan el 9088 abierto: sin él se omiten
      # en silencio y la suite queda verde sin haberlo probado.
      #
      # La imagen va por digest como el resto (REL-006). Iba por `latest`, que es
      # un puntero que alguien más mueve: la versión contra la que se prueba
      # podía cambiar sin que cambiara una línea de este repositorio, y sin que
      # nadie se enterara hasta ver un fallo raro.
      - name: Levantar Informix
        run: |
          docker run -d --name druse-informix \
            -e LICENSE=accept \
            -e DB_INIT=1 \
            -p 9088:9088 \
            -p 9089:9089 \
            icr.io/informix/informix-developer-database:latest@sha256:8202d69ba5674df4b13140d5121dd11b7b26b28dc60119b7e8f87e533e538ba1

          # Se espera a «On-Line», no a que `onstat` responda: el servidor pasa
          # primero por modo administrativo, donde ya contesta pero rechaza toda
          # conexión con «27002: No connections are allowed in quiescent mode».
          for _ in $(seq 1 60); do
            if docker exec druse-informix bash -lc 'onstat -' 2>/dev/null | grep -q 'On-Line'; then
              echo "Informix en línea."
              exit 0
            fi
            sleep 5
          done

          echo "Informix no respondió a tiempo."
          docker logs --tail 40 druse-informix
          exit 1

      - name: Crear las bases adicionales
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE druse_test_secondary;"

          docker exec "${{ job.services.sqlserver.id }}" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Druse_dev_only_1' -C \
            -Q "IF DB_ID('druse_test') IS NULL CREATE DATABASE druse_test; IF DB_ID('druse_test_secondary') IS NULL CREATE DATABASE druse_test_secondary;"

          docker exec "${{ job.services.mysql.id }}" \
            mysql -uroot -pdruse_dev_only \
            -e "CREATE DATABASE IF NOT EXISTS druse_test_secondary;"

          # Informix no tiene `CREATE DATABASE IF NOT EXISTS`, y las bases deben
          # llevar registro de transacciones porque DRDA lo exige: sin `WITH LOG`
          # el servidor está vivo pero rechaza la conexión.
          docker exec druse-informix bash -lc \
            'echo "CREATE DATABASE druse_test WITH LOG;" | dbaccess - -
             echo "CREATE DATABASE druse_test2 WITH LOG;" | dbaccess - -'

      - name: Probar contra los cuatro motores
        run: >
          dotnet test backend/Druse.slnx
          --configuration Release
          -m:1
          --verbosity normal
          --results-directory artifacts/test-results
          --logger trx

      - name: Comprobar que se ejecutaron pruebas
        if: always()
        shell: pwsh
        run: >
          ./build/scripts/check-tests.ps1
          -ResultsDirectory artifacts/test-results
          -ExpectedSuites 3
          -MinimumTests 800

  # La aplicación entera por donde la usa una persona: Angular, la API local y un
  # PostgreSQL de verdad. Es el único job que prueba las tres capas juntas, y por
  # eso vale la pena aunque tarde: lo que se le escapa a las otras es justamente
  # que encajen entre sí.
  #
  # Solo en Linux. Un E2E por sistema operativo triplicaría el tiempo para
  # comprobar tres veces lo mismo: lo que aquí se ejercita es la aplicación, no
  # el sistema debajo.
  e2e:
    name: Punta a punta
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine@sha256:63bdc97d67b5133bf0e5ebd500bec6d046fa851dc81340d838f0347e616107e8
        env:
          POSTGRES_PASSWORD: druse_dev_only
          POSTGRES_DB: druse_test
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar dependencias de las pruebas
        working-directory: e2e
        run: npm ci

      # Las pruebas de Playwright son TypeScript que nadie compila: cada archivo
      # se transpila y se ejecuta. Un error de tipos no aparece hasta que rompe
      # una prueba por otra razón, o no aparece.
      - name: Comprobar tipos de las pruebas
        working-directory: e2e
        run: npm run typecheck

      # Solo Chromium: los navegadores pesan y aquí no se está probando la
      # compatibilidad entre ellos, sino que la aplicación funcione.
      - name: Instalar el navegador
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Probar
        working-directory: e2e
        run: npm test

      # El informe solo sirve cuando algo falló, y entonces es lo primero que se
      # mira: trae la traza, la captura y el vídeo del momento exacto.
      - name: Recoger el informe
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-informe
          path: e2e/playwright-report/**
          retention-days: 14

  # Las pruebas de los guiones de construcción. No compilan, no publican y no
  # levantan contenedores: ejercitan con dobles lo que decide si un paquete se
  # puede repartir —qué archivos lleva dentro— y si las bases de prueba quedan
  # expuestas a la red. Es un minuto de runner y son justo las comprobaciones
  # que nadie recuerda ejecutar a mano antes de una release.
  guiones-de-construccion:
    name: Guiones de construcción
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Contenido del paquete y manifiesto
        shell: pwsh
        run: ./build/tests/manifiesto-paquete.ps1

      - name: Rechazo de un artefacto alterado
        run: node build/tests/verificacion-de-actualizacion.cjs

      - name: Guardas de una publicación
        shell: pwsh
        run: ./build/tests/release-verificacion.ps1

      - name: Workflow CI requerido para publicar
        shell: pwsh
        run: ./build/tests/ci-release.ps1

      - name: Puertos de las bases de prueba (PowerShell)
        shell: pwsh
        run: ./build/tests/test-db-loopback.ps1

      - name: Puertos de las bases de prueba (Bash)
        run: bash build/tests/test-db-loopback.sh

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Las pruebas del frontend son Node y un navegador sin cabeza: lo que
        # comprueban no cambia por el sistema de debajo. Repetirlas tres veces
        # costaba trece minutos de cuota por cada minuto real.
        os: >-
          ${{ fromJSON((github.event.inputs.completo == 'true')
          && '["windows-latest","ubuntu-latest","macos-latest"]'
          || '["ubuntu-latest"]') }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      # El formato se comprueba, no se pide por favor: sin esto, cada quien
      # escribe como le sale y los diffs se llenan de líneas que no cambian nada.
      # Se arregla con `npm run format`.
      - name: Comprobar el formato
        run: npm run format:check

      - name: Compilar
        run: npm run build

      - name: Probar
        run: npm test

  # Compila el envoltorio de escritorio. No genera instaladores —eso se hace al
  # publicar una versión— pero sí detecta que el código Rust dejó de compilar,
  # que es lo que se escaparía sin este job.
  escritorio:
    name: Envoltorio de escritorio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # rama stable, 3-9-2026
        with:
          # Fijada por SHA, la acción ya no puede deducir el canal del nombre
          # de la rama: hay que decirle cuál se quiere.
          toolchain: stable
          components: rustfmt, clippy

      - name: Dependencias de Tauri en Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Comprobar que el envoltorio compila
        working-directory: shells/desktop-tauri
        run: cargo check --locked

      # Las pruebas del envoltorio solo se ejecutaban a mano, y en este equipo
      # además hace falta cargar antes el entorno de MSVC. Aquí corren siempre.
      - name: Comprobar el formato
        working-directory: shells/desktop-tauri
        run: cargo fmt --check

      - name: Analizar con Clippy
        working-directory: shells/desktop-tauri
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Probar el envoltorio
        working-directory: shells/desktop-tauri
        run: cargo test --locked

  # Comprueba que la API se puede publicar autocontenida para cada plataforma
  # objetivo, sin que el usuario final necesite el SDK de .NET (ADR 0003).
  publicacion-autocontenida:
    name: Publicación autocontenida (${{ matrix.rid }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Los tres desde Linux. `dotnet publish -r <rid>` no necesita estar en
        # ese sistema: restaura los paquetes de ese RID y copia sus archivos.
        # Comprobado publicando osx-arm64 desde Windows, que es la misma
        # operación al revés. Lo que este job comprueba es que la publicación
        # autocontenida existe para cada plataforma, no que arranque allí.
        rid: [win-x64, linux-x64, osx-arm64]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Publicar API
        run: >
          dotnet publish backend/src/Druse.Host.LocalApi
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.rid }}

  # Genera los instaladores de Linux y macOS, que es lo que no puede salir de la
  # máquina de desarrollo: cada plataforma solo empaqueta lo suyo. El de Windows
  # se construye con `build/scripts/package.ps1`.
  #
  # Los artefactos quedan descargables desde la ejecución. No están firmados ni
  # notarizados —eso es otra tarea, del backlog—, así que sirven para probar la
  # aplicación, no para repartirla.
  paquete-de-escritorio:
    name: Paquete de escritorio (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # El instalador de macOS solo puede construirse en macOS, y eso son
        # diez minutos de cuota por cada minuto real. Va al recorrido completo;
        # el de Linux sigue en cada push.
        include: >-
          ${{ fromJSON((github.event.inputs.completo == 'true')
          && '[{"os":"ubuntu-latest","rid":"linux-x64","bundles":"deb,appimage"},{"os":"macos-latest","rid":"osx-arm64","bundles":"dmg,app"}]'
          || '[{"os":"ubuntu-latest","rid":"linux-x64","bundles":"deb,appimage"}]') }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Instalar .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # rama stable, 3-9-2026
        with:
          toolchain: stable

      # `libfuse2` es para el AppImage y no para Tauri: linuxdeploy se empaqueta
      # a sí mismo como AppImage y necesita FUSE 2 para arrancar. Sin él la
      # construcción llega hasta el final y muere con «failed to run linuxdeploy»,
      # que no menciona la causa.
      - name: Dependencias de Tauri en Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # El CLI de Tauri no viene con el runner y compilarlo lleva varios minutos,
      # así que se guarda el binario ya construido entre ejecuciones.
      - name: Recuperar el CLI de Tauri
        id: cli-de-tauri
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-2-${{ runner.os }}

      - name: Instalar el CLI de Tauri
        if: steps.cli-de-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # La API viaja dentro del paquete, así que se publica en el directorio que
      # `tauri.conf.json` declara como recurso. Es lo mismo que hace el paso 1 de
      # `package.ps1`.
      - name: Publicar la API dentro del envoltorio
        run: >
          dotnet publish backend/src/Druse.Host.LocalApi
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output shells/desktop-tauri/api
          -p:PublishSingleFile=false
          -p:DebugType=none

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Los formatos se piden por línea de comandos porque `tauri.conf.json` fija
      # los de Windows —NSIS y MSI—, que aquí no existen.
      #
      # `APPIMAGE_EXTRACT_AND_RUN` es para linuxdeploy, que se distribuye a sí
      # mismo como AppImage y necesita FUSE para montarse. En un runner no lo
      # tiene, y falla con «failed to run linuxdeploy» sin decir por qué; con
      # esto se extrae en lugar de montarse. Instalar libfuse2 no basta.
      - name: Empaquetar
        working-directory: shells/desktop-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Recoger los artefactos
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: druse-${{ matrix.rid }}
          path: shells/desktop-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
