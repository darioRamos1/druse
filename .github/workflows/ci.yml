name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore backend/Druse.slnx

      - name: Compilar
        run: dotnet build backend/Druse.slnx --configuration Release --no-restore

      - name: Probar
        run: dotnet test backend/Druse.slnx --configuration Release --no-build --verbosity normal

  # Las pruebas contra motores reales solo corren en Linux: los ejecutores de
  # Windows y macOS no traen Docker, y montarlo ahí multiplicaría el tiempo sin
  # aportar nada. Lo que se valida aquí son los proveedores, no el sistema.
  backend-con-motores-reales:
    name: Backend con los cuatro motores
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: druse_dev_only
          POSTGRES_DB: druse_test
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Druse_dev_only_1
          MSSQL_PID: Developer
        ports:
          - 14433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Druse_dev_only_1 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: druse_dev_only
          MYSQL_DATABASE: druse_test
        ports:
          - 33306:3306
        options: >-
          --health-cmd "mysqladmin ping -uroot -pdruse_dev_only"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DRUSE_TEST_PG_HOST: 127.0.0.1
      DRUSE_TEST_PG_PORT: 55440
      DRUSE_TEST_PG_DB: druse_test
      DRUSE_TEST_PG_SECOND_DB: druse_test_secondary
      DRUSE_TEST_PG_USER: postgres
      DRUSE_TEST_PG_PASSWORD: druse_dev_only

      DRUSE_TEST_MSSQL_HOST: 127.0.0.1
      DRUSE_TEST_MSSQL_PORT: 14433
      DRUSE_TEST_MSSQL_DB: druse_test
      DRUSE_TEST_MSSQL_SECOND_DB: druse_test_secondary
      DRUSE_TEST_MSSQL_USER: sa
      DRUSE_TEST_MSSQL_PASSWORD: Druse_dev_only_1

      DRUSE_TEST_MYSQL_HOST: 127.0.0.1
      DRUSE_TEST_MYSQL_PORT: 33306
      DRUSE_TEST_MYSQL_DB: druse_test
      DRUSE_TEST_MYSQL_SECOND_DB: druse_test_secondary
      DRUSE_TEST_MYSQL_USER: root
      DRUSE_TEST_MYSQL_PASSWORD: druse_dev_only

      DRUSE_TEST_IFX_HOST: 127.0.0.1
      DRUSE_TEST_IFX_PORT: 9089
      DRUSE_TEST_IFX_DB: druse_test
      DRUSE_TEST_IFX_SECOND_DB: druse_test2
      DRUSE_TEST_IFX_USER: informix
      DRUSE_TEST_IFX_PASSWORD: in4mix

      # Sin esto, un motor caído se manifestaría como una suite en verde que no
      # comprobó nada. Aquí ese caso debe romper la compilación.
      DRUSE_REQUIRE_ENGINES: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Informix va como paso y no como `service` a propósito. Su comprobación de
      # salud necesita un shell de login —`onstat` no está en el PATH sin cargar
      # el perfil— y el arranque pasa de largo cualquier margen razonable de los
      # servicios, así que como servicio el job muere con «One or more containers
      # failed to start» sin más explicación. Aquí se espera con el mismo bucle
      # que usa `build/scripts/test-db.ps1`, que es el que ya funciona en local.
      #
      # Se publica el 9089, que es el escuchador DRDA por donde habla Druse; el
      # 9088 atiende el protocolo nativo y usarlo da un error que parece de
      # credenciales.
      - name: Levantar Informix
        run: |
          docker run -d --name druse-informix \
            -e LICENSE=accept \
            -e DB_INIT=1 \
            -p 9089:9089 \
            icr.io/informix/informix-developer-database:latest

          for _ in $(seq 1 60); do
            if docker exec druse-informix bash -lc 'onstat -' > /dev/null 2>&1; then
              echo "Informix listo."
              exit 0
            fi
            sleep 5
          done

          echo "Informix no respondió a tiempo."
          docker logs --tail 40 druse-informix
          exit 1

      - name: Crear las bases adicionales
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE druse_test_secondary;"

          docker exec "${{ job.services.sqlserver.id }}" \
            /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Druse_dev_only_1' -C \
            -Q "IF DB_ID('druse_test') IS NULL CREATE DATABASE druse_test; IF DB_ID('druse_test_secondary') IS NULL CREATE DATABASE druse_test_secondary;"

          docker exec "${{ job.services.mysql.id }}" \
            mysql -uroot -pdruse_dev_only \
            -e "CREATE DATABASE IF NOT EXISTS druse_test_secondary;"

          # Informix no tiene `CREATE DATABASE IF NOT EXISTS`, y las bases deben
          # llevar registro de transacciones porque DRDA lo exige: sin `WITH LOG`
          # el servidor está vivo pero rechaza la conexión.
          docker exec druse-informix bash -lc \
            'echo "CREATE DATABASE druse_test WITH LOG;" | dbaccess - -
             echo "CREATE DATABASE druse_test2 WITH LOG;" | dbaccess - -'

      - name: Probar contra los cuatro motores
        run: dotnet test backend/Druse.slnx --configuration Release --verbosity normal

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Probar
        run: npm test

  # Compila el envoltorio de escritorio. No genera instaladores —eso se hace al
  # publicar una versión— pero sí detecta que el código Rust dejó de compilar,
  # que es lo que se escaparía sin este job.
  escritorio:
    name: Envoltorio de escritorio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Dependencias de Tauri en Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Comprobar que el envoltorio compila
        working-directory: shells/desktop-tauri
        run: cargo check --locked

  # Comprueba que la API se puede publicar autocontenida para cada plataforma
  # objetivo, sin que el usuario final necesite el SDK de .NET (ADR 0003).
  publicacion-autocontenida:
    name: Publicación autocontenida (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar API
        run: >
          dotnet publish backend/src/Druse.Host.LocalApi
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.rid }}

  # Genera los instaladores de Linux y macOS, que es lo que no puede salir de la
  # máquina de desarrollo: cada plataforma solo empaqueta lo suyo. El de Windows
  # se construye con `build/scripts/package.ps1`.
  #
  # Los artefactos quedan descargables desde la ejecución. No están firmados ni
  # notarizados —eso es otra tarea, del backlog—, así que sirven para probar la
  # aplicación, no para repartirla.
  paquete-de-escritorio:
    name: Paquete de escritorio (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
            bundles: deb,appimage
          - os: macos-latest
            rid: osx-arm64
            bundles: dmg,app

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      # `libfuse2` es para el AppImage y no para Tauri: linuxdeploy se empaqueta
      # a sí mismo como AppImage y necesita FUSE 2 para arrancar. Sin él la
      # construcción llega hasta el final y muere con «failed to run linuxdeploy»,
      # que no menciona la causa.
      - name: Dependencias de Tauri en Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # El CLI de Tauri no viene con el runner y compilarlo lleva varios minutos,
      # así que se guarda el binario ya construido entre ejecuciones.
      - name: Recuperar el CLI de Tauri
        id: cli-de-tauri
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: cargo-tauri-2-${{ runner.os }}

      - name: Instalar el CLI de Tauri
        if: steps.cli-de-tauri.outputs.cache-hit != 'true'
        run: cargo install tauri-cli --version "^2" --locked

      # La API viaja dentro del paquete, así que se publica en el directorio que
      # `tauri.conf.json` declara como recurso. Es lo mismo que hace el paso 1 de
      # `package.ps1`.
      - name: Publicar la API dentro del envoltorio
        run: >
          dotnet publish backend/src/Druse.Host.LocalApi
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output shells/desktop-tauri/api
          -p:PublishSingleFile=false
          -p:DebugType=none

      - name: Compilar el frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Los formatos se piden por línea de comandos porque `tauri.conf.json` fija
      # los de Windows —NSIS y MSI—, que aquí no existen.
      - name: Empaquetar
        working-directory: shells/desktop-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Recoger los artefactos
        uses: actions/upload-artifact@v4
        with:
          name: druse-${{ matrix.rid }}
          path: shells/desktop-tauri/target/release/bundle/**
          if-no-files-found: error
          retention-days: 14
