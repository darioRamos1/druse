name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar
        run: dotnet restore backend/Druse.slnx

      - name: Compilar
        run: dotnet build backend/Druse.slnx --configuration Release --no-restore

      - name: Probar
        run: dotnet test backend/Druse.slnx --configuration Release --no-build --verbosity normal

  # Las pruebas contra un motor real solo corren en Linux: los ejecutores de
  # Windows y macOS no traen Docker, y montarlo ahí multiplicaría el tiempo sin
  # aportar nada. Lo que se valida aquí es el proveedor, no el sistema operativo.
  backend-con-postgresql:
    name: Backend con PostgreSQL real
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: druse_dev_only
          POSTGRES_DB: druse_test
        ports:
          - 55440:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DRUSE_TEST_PG_HOST: 127.0.0.1
      DRUSE_TEST_PG_PORT: 55440
      DRUSE_TEST_PG_DB: druse_test
      DRUSE_TEST_PG_USER: postgres
      DRUSE_TEST_PG_PASSWORD: druse_dev_only

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Probar contra PostgreSQL
        run: dotnet test backend/Druse.slnx --configuration Release --verbosity normal

  frontend:
    name: Frontend (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar
        run: npm run build

      - name: Probar
        run: npm test

  # Comprueba que la API se puede publicar autocontenida para cada plataforma
  # objetivo, sin que el usuario final necesite el SDK de .NET (ADR 0003).
  publicacion-autocontenida:
    name: Publicación autocontenida (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-latest
            rid: osx-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publicar
        run: >
          dotnet publish backend/src/Druse.Host.LocalApi
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          --output artifacts/${{ matrix.rid }}
