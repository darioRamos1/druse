<div class="brand">
  <button
    type="button"
    class="icon-button explorer-toggle"
    [attr.aria-label]="
      explorerOpen()
        ? 'Ocultar explorador de bases de datos'
        : 'Mostrar explorador de bases de datos'
    "
    [attr.aria-expanded]="explorerOpen()"
    aria-controls="connections-explorer"
    [title]="'Explorador de bases de datos (' + shortcut('Ctrl+Shift+E') + ')'"
    (click)="toggleExplorer.emit()"
  >
    <app-icon name="panel-left" [size]="16" />
  </button>
  <span class="brand__mark" aria-hidden="true"><span class="brand__core"></span></span>
  <span class="brand__name">Druse</span>
</div>

<span class="divider" aria-hidden="true"></span>

<div class="actions">
  <button type="button" class="btn btn--primary" (click)="newConnection.emit()">
    <app-icon name="plus" [size]="12" class="btn__icon" />
    Nueva conexión
  </button>
  <button type="button" class="btn" (click)="newQuery.emit()">
    <app-icon name="new-query" [size]="12" />
    Nueva consulta
  </button>
  <details class="file-menu" appDisclosure #fileMenu="disclosure">
    <summary class="btn" aria-label="Archivo">
      <app-icon name="folder-open" [size]="13" />
      Archivo
      <app-icon name="chevron-down" [size]="10" />
    </summary>
    <div class="file-menu__panel" role="group" aria-label="Acciones de archivo">
      <button type="button" aria-label="Abrir SQL" (click)="fileMenu.close(true); openSql.emit()">
        <app-icon name="folder-open" [size]="14" />
        Abrir SQL <kbd>{{ shortcut('Ctrl+O') }}</kbd>
      </button>
      <button type="button" aria-label="Guardar" (click)="fileMenu.close(true); saveSql.emit()">
        <app-icon name="save" [size]="14" />
        Guardar <kbd>{{ shortcut('Ctrl+S') }}</kbd>
      </button>
      <button
        type="button"
        aria-label="Guardar como"
        (click)="fileMenu.close(true); saveSqlAs.emit()"
      >
        <span class="file-menu__indent"></span>
        Guardar como… <kbd>{{ shortcut('Ctrl+Shift+S') }}</kbd>
      </button>
    </div>
  </details>
</div>

<div class="search-slot">
  <!--
    Cuando no cabe el texto, se queda el icono: a media ventana el rótulo se
    recortaba a nada —«Buscar tabl…», y a 1.024 px ni eso— y un campo de búsqueda
    con un jirón de frase dentro no dice para qué sirve. El título va siempre,
    así que la explicación no se pierde con la palabra.
  -->
  <button
    type="button"
    class="search"
    aria-label="Abrir búsqueda global"
    [title]="'Buscar tablas, consultas y conexiones (' + shortcut('Ctrl+K') + ')'"
    (click)="openPalette.emit()"
  >
    <app-icon name="search" [size]="13" />
    <span class="search__placeholder">Buscar en Druse…</span>
    <kbd class="search__shortcut">{{ shortcut('Ctrl+K') }}</kbd>
  </button>
</div>

<div class="trailing">
  <!--
    El asistente se abre y se cierra desde aqui, y el boton se queda encendido
    mientras esta abierto: es la unica pista de que esa columna existe.
  -->
  <button
    type="button"
    class="assistant"
    [class.is-active]="assistantOpen()"
    [attr.aria-pressed]="assistantOpen()"
    aria-label="Asistente"
    (click)="toggleAssistant.emit()"
  >
    <app-icon name="sparkles" [size]="13" />
    Asistente
  </button>

  <div class="segmented" role="group" aria-label="Tema">
    <button
      type="button"
      class="segmented__item"
      [class.is-active]="theme() === 'light'"
      [attr.aria-pressed]="theme() === 'light'"
      aria-label="Tema claro"
      (click)="themeSelected.emit('light')"
    >
      <app-icon name="sun" [size]="13" />
    </button>
    <button
      type="button"
      class="segmented__item"
      [class.is-active]="theme() === 'dark'"
      [attr.aria-pressed]="theme() === 'dark'"
      aria-label="Tema oscuro"
      (click)="themeSelected.emit('dark')"
    >
      <app-icon name="moon" [size]="13" />
    </button>
  </div>

  <button type="button" class="icon-button" aria-label="Preferencias" (click)="openSettings.emit()">
    <app-icon name="settings" [size]="15" />
  </button>

  <span class="divider divider--spaced" aria-hidden="true"></span>

  <div class="window-controls" aria-hidden="true">
    <span class="window-controls__dot window-controls__dot--minimize"></span>
    <span class="window-controls__dot window-controls__dot--maximize"></span>
    <span class="window-controls__dot window-controls__dot--close"></span>
  </div>
</div>
