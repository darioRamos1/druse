<app-top-bar (newConnection)="openDialog()" (newQuery)="createTab()" />

<div class="body">
  <app-connections-sidebar
    class="sidebar"
    [style.width.px]="sidebarWidth()"
    [connections]="connections()"
    [explorerNodes]="explorerNodes()"
    (addConnection)="openDialog()"
    (toggleConnection)="toggleConnection($event)"
    (connectSaved)="connectSaved($event)"
    (toggleNode)="toggleNode($event)"
    (refreshNode)="refreshNode($event)"
    (disconnect)="disconnect($event)"
    (forget)="forget($event)"
    (openNode)="openNode($event)"
    (copied)="onCopied($event)"
    (copyFailed)="onCopyFailed()"
  />

  <app-resize-handle
    axis="width"
    [(size)]="sidebarWidth"
    [min]="sidebarMin"
    [max]="sidebarMax"
    aria-label="Ancho del panel de conexiones"
  />

  <main class="main">
    <app-editor-tabs
      [tabs]="tabs()"
      (select)="selectTab($event)"
      (close)="closeTab($event)"
      (create)="createTab()"
    />

    <app-editor-toolbar
      [context]="editorContext()"
      [running]="running()"
      [hasSelection]="hasSelection()"
      [canExecute]="hasConnection()"
      [timeoutSeconds]="timeoutSeconds()"
      (execute)="execute()"
      (executeSelection)="executeSelection()"
      (cancel)="cancel()"
      (format)="format()"
      (timeoutChange)="setTimeout($event)"
    />

    <app-sql-editor
      #editor
      class="editor"
      [value]="sql()"
      [engine]="activeEngine()"
      [schema]="schemaIndex()"
      [loadColumns]="loadColumns"
      [loadRelations]="loadRelations"
      (valueChange)="onSqlChange($event)"
      (cursorChange)="onCursorChange($event)"
      (selectionChange)="onSelectionChange($event)"
      (execute)="execute()"
      (executeSelection)="executeSelection()"
      (cancel)="cancel()"
      (save)="saveTab()"
      (newTab)="createTab()"
      (formatFailed)="onFormatFailed($event)"
    />

    @if (rejection(); as pending) {
      <div class="banner banner--warning" role="alertdialog" aria-live="assertive">
        <div class="banner__text">
          <strong class="banner__title">{{ pending.message }}</strong>
          <ul class="banner__risks">
            @for (risk of pending.risks; track risk.kind) {
              <li>{{ risk.description }}</li>
            }
          </ul>
        </div>
        <div class="banner__actions">
          @if (pending.reason === 'unconfirmeddestructive') {
            <button type="button" class="banner__button banner__button--danger" (click)="confirmDestructive()">
              Ejecutar de todos modos
            </button>
          }
          <button type="button" class="banner__button" (click)="dismissRejection()">Cancelar</button>
        </div>
      </div>
    } @else if (notice(); as message) {
      <div class="banner" role="status" aria-live="polite">
        <span class="banner__text">{{ message }}</span>
        <button type="button" class="banner__button" (click)="dismissNotice()">Cerrar</button>
      </div>
    }

    <app-resize-handle
      axis="height"
      [(size)]="resultsHeight"
      [min]="resultsMin"
      [max]="resultsMax"
      [inverted]="true"
      aria-label="Alto del panel de resultados"
    />

    <app-results-panel
      class="results"
      [style.height.px]="resultsHeight()"
      [resultSet]="resultSet()"
      [result]="result()"
      [history]="history()"
      [exporting]="exporting()"
      (refreshHistory)="refreshHistory()"
      (searchHistory)="searchHistory($event)"
      (clearHistory)="clearHistory()"
      (reuseQuery)="reuseQuery($event)"
      (exportAs)="exportAs($event)"
      (copied)="onCopied($event)"
      (copyFailed)="onCopyFailed()"
    />

    <app-status-bar [session]="session()" [line]="cursor().line" [column]="cursor().column" />
  </main>
</div>

@if (dialogOpen()) {
  <app-connection-dialog (closed)="closeDialog()" />
}
