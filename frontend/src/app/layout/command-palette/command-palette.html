<div class="backdrop" (click)="close()"></div>

<section
  class="palette"
  role="dialog"
  aria-modal="true"
  aria-label="Paleta de comandos"
  (keydown)="trapFocus($event)"
>
  <header class="search">
    <app-icon name="search" [size]="15" />
    <input
      #search
      type="search"
      placeholder="Buscar conexiones, tablas, vistas o comandos"
      aria-label="Buscar comandos"
      aria-controls="palette-results"
      [attr.aria-activedescendant]="items().length ? 'palette-option-' + selected() : null"
      [value]="query()"
      (input)="onInput($event)"
      (keydown.arrowdown)="move(1); $event.preventDefault()"
      (keydown.arrowup)="move(-1); $event.preventDefault()"
      (keydown.enter)="run(); $event.preventDefault()"
      (keydown.escape)="close()"
    />
    <kbd>Esc</kbd>
  </header>

  <div id="palette-results" class="results" role="listbox" aria-label="Resultados">
    @for (item of items(); track item.id; let index = $index) {
      <button
        type="button"
        class="result"
        [id]="'palette-option-' + index"
        role="option"
        [class.is-selected]="index === selected()"
        [attr.aria-selected]="index === selected()"
        (mouseenter)="selected.set(index)"
        (click)="run(item)"
      >
        <span class="result__icon">
          @if (item.kind === 'connection') {
            <app-engine-badge [engine]="item.connection.engine" />
          } @else if (item.kind === 'object') {
            <app-icon name="table" [size]="13" />
          } @else {
            <app-icon name="console" [size]="13" />
          }
        </span>
        <span class="result__text">
          <strong>{{ item.label }}</strong>
          <small>{{ item.hint }}</small>
        </span>
        <span class="result__kind">{{ item.kind === 'object' ? item.node.kind : item.kind }}</span>
      </button>
    } @empty {
      <p class="empty">No hay coincidencias. Prueba con otro nombre.</p>
    }
  </div>

  <footer class="foot">
    <span><kbd>↑</kbd><kbd>↓</kbd> navegar</span>
    <span><kbd>Enter</kbd> abrir</span>
    <span class="spacer"></span>
    <span>{{ items().length }} resultados</span>
  </footer>
</section>
