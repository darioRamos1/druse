<button
  type="button"
  class="run"
  [disabled]="running() || !canExecute()"
  [attr.title]="canExecute() ? null : 'Abre una conexión para poder ejecutar'"
  (click)="execute.emit()"
>
  <app-icon name="play" [size]="11" />
  Ejecutar
  <kbd class="run__shortcut">⌘⏎</kbd>
</button>

<button
  type="button"
  class="btn"
  [disabled]="running() || !hasSelection() || !canExecute()"
  (click)="executeSelection.emit()"
>
  <app-icon name="play-outline" [size]="11" />
  Ejecutar selección
</button>

<button type="button" class="btn" [disabled]="!running()" (click)="cancel.emit()">
  <app-icon name="stop" [size]="11" />
  Cancelar
</button>

<span class="divider" aria-hidden="true"></span>

<button type="button" class="btn" title="Formatear (Ctrl+Shift+F)" (click)="format.emit()">
  <app-icon name="format" [size]="11" />
  Formatear
</button>

<span class="divider" aria-hidden="true"></span>

<button type="button" class="btn btn--commit">Commit</button>
<button type="button" class="btn btn--rollback">Rollback</button>

<span class="spacer"></span>

<button type="button" class="chip">
  <span class="chip__dot" aria-hidden="true"></span>
  <span class="chip__mono">{{ context() }}</span>
  <app-icon name="chevron-down" [size]="9" />
</button>

<div class="timeout">
  <button
    type="button"
    class="chip"
    [attr.aria-expanded]="editingTimeout()"
    title="Tiempo máximo de ejecución"
    (click)="toggleTimeout()"
  >
    <app-icon name="clock" [size]="12" />
    Timeout <span class="chip__value">{{ label(timeoutSeconds()) }}</span>
    <app-icon name="chevron-down" [size]="9" />
  </button>

  @if (editingTimeout()) {
    <ul class="timeout__menu" role="listbox">
      @for (option of timeoutOptions; track option) {
        <li>
          <button
            type="button"
            class="timeout__option"
            role="option"
            [attr.aria-selected]="option === timeoutSeconds()"
            [class.is-selected]="option === timeoutSeconds()"
            (click)="chooseTimeout(option)"
          >
            {{ label(option) }}
          </button>
        </li>
      }
    </ul>
  }
</div>
