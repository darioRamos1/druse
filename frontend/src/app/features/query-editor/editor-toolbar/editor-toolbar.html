<button
  type="button"
  class="run"
  [disabled]="running() || !canExecute()"
  [attr.title]="canExecute() ? null : 'Abre una conexión para poder ejecutar'"
  (click)="execute.emit()"
>
  <app-icon name="play" [size]="11" />
  Ejecutar
  <kbd class="run__shortcut">⌘⏎</kbd>
</button>

<button
  type="button"
  class="btn"
  [disabled]="running() || !hasSelection() || !canExecute()"
  (click)="executeSelection.emit()"
>
  <app-icon name="play-outline" [size]="11" />
  Ejecutar selección
</button>

<button type="button" class="btn" [disabled]="!running()" (click)="cancel.emit()">
  <app-icon name="stop" [size]="11" />
  Cancelar
</button>

<span class="divider" aria-hidden="true"></span>

<button type="button" class="btn" title="Formatear (Ctrl+Shift+F)" (click)="format.emit()">
  <app-icon name="format" [size]="11" />
  Formatear
</button>

<span class="divider" aria-hidden="true"></span>

@if (transactionOpen()) {
  <!--
    El indicador dice a qué conexión afecta, no solo que hay una transacción: es
    de la conexión, así que lo que se ejecute en otra pestaña del mismo perfil
    también entra en ella.
  -->
  <span class="tx" [attr.title]="transactionHint()">
    <span class="tx__dot" aria-hidden="true"></span>
    Transacción abierta en <strong>{{ transactionScope() }}</strong>
  </span>

  <button
    type="button"
    class="btn btn--commit"
    [disabled]="transactionBusy()"
    (click)="commit.emit()"
  >
    Commit
  </button>
  <button
    type="button"
    class="btn btn--rollback"
    [disabled]="transactionBusy()"
    (click)="rollback.emit()"
  >
    Rollback
  </button>
} @else {
  <!--
    Al modo manual se entra a propósito. El autocommit sigue siendo lo normal, y
    Commit y Rollback no aparecen mientras no haya nada que confirmar.
  -->
  <button
    type="button"
    class="btn"
    [disabled]="transactionBusy() || !canExecute()"
    [attr.title]="canExecute() ? 'Nada se confirmará hasta que pulses Commit' : 'Abre una conexión para poder usar transacciones'"
    (click)="beginTransaction.emit()"
  >
    Iniciar transacción
  </button>
}

<span class="spacer"></span>

<button type="button" class="chip">
  <span class="chip__dot" aria-hidden="true"></span>
  <span class="chip__mono">{{ context() }}</span>
  <app-icon name="chevron-down" [size]="9" />
</button>

<div class="timeout">
  <button
    type="button"
    class="chip"
    [attr.aria-expanded]="editingTimeout()"
    title="Tiempo máximo de ejecución"
    (click)="toggleTimeout()"
  >
    <app-icon name="clock" [size]="12" />
    Timeout <span class="chip__value">{{ label(timeoutSeconds()) }}</span>
    <app-icon name="chevron-down" [size]="9" />
  </button>

  @if (editingTimeout()) {
    <ul class="timeout__menu" role="listbox">
      @for (option of timeoutOptions; track option) {
        <li>
          <button
            type="button"
            class="timeout__option"
            role="option"
            [attr.aria-selected]="option === timeoutSeconds()"
            [class.is-selected]="option === timeoutSeconds()"
            (click)="chooseTimeout(option)"
          >
            {{ label(option) }}
          </button>
        </li>
      }
    </ul>
  }
</div>
