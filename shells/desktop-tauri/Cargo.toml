[package]
name = "druse"
version = "0.1.0"
description = "Cliente de bases de datos de escritorio"
authors = ["Darío Ramos"]
edition = "2021"
rust-version = "1.77.2"

# El binario se llama igual que el producto: es lo que verá el usuario en el
# administrador de tareas y en el acceso directo.
[[bin]]
name = "druse"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Para localizar el directorio de datos del usuario con la misma convención que
# usa IAppPaths en el backend.
dirs = "5"
tauri-plugin-dialog = "2"

[features]
# Lo activa `tauri build`; en desarrollo se deja fuera para que la consola
# siga disponible.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Un cliente de bases de datos no gana nada con un binario enorme: se optimiza
# por tamaño y se recortan los símbolos.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
